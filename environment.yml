name: screen-ocr
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  # Cài PyTorch với CUDA 12.1 qua channel chính thức
  - pytorch>=2.2.0
  - torchvision>=0.17.0
  - pytorch-cuda=12.1
  - pip
  - pip:
      # ONNX Runtime (GPU)
      - onnxruntime-gpu>=1.17.0
      - onnx>=1.16.0
      # Screen Capture
      - mss>=9.0.0
      # Image Processing
      - Pillow>=10.0.0
      - opencv-python>=4.9.0
      - albumentations>=1.3.0
      # Windows UI Automation
      - uiautomation>=2.0.18
      # HuggingFace
      - datasets>=2.0.18
      # API
      - fastapi>=0.110.0
      - uvicorn>=0.29.0
      # Metrics & Tracking
      - jiwer>=3.0.0
      - wandb>=0.16.0
      # Utils & Config
      - pyyaml>=6.0.0
      - tqdm>=4.66.0
      - numpy>=1.26.0
      # Testing & Notebooks
      - pytest>=8.0.0
      - jupyter>=1.0.0
      - matplotlib>=3.8.0
