name: screen-ocr
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  # Cài PyTorch qua pip để đảm bảo lấy đúng bản hỗ trợ CUDA 12.4 (RTX 5090)
  - pip
  - pip:
      # PyTorch cho RTX 5090 (Blackwell - sm_120 đòi hỏi tối thiểu CUDA 13.0+)
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu132
      - torch>=2.10.0
      - torchvision>=0.23.0
      # ONNX Runtime (GPU)
      - onnxruntime-gpu>=1.17.0
      - onnx>=1.16.0
      # Screen Capture
      - mss>=9.0.0
      # Image Processing
      - Pillow>=10.0.0
      - opencv-python>=4.9.0
      - albumentations>=1.3.0
      # Windows UI Automation
      - uiautomation>=2.0.18
      # HuggingFace
      - datasets>=2.0.18
      # API & UI
      - fastapi>=0.110.0
      - uvicorn>=0.29.0
      - gradio>=4.0.0
      # Metrics & Tracking
      - jiwer>=3.0.0
      - wandb>=0.16.0
      # Utils & Config
      - pyyaml>=6.0.0
      - tqdm>=4.66.0
      - numpy>=1.26.0
      - pandas>=2.0.0
      - gdown>=5.0.0
      - pyclipper>=1.3.0
      # Testing & Notebooks
      - pytest>=8.0.0
      - jupyter>=1.0.0
      - matplotlib>=3.8.0
