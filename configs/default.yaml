# ─── Screen OCR Engine — Default Config ──────────────────────────────────────
# Mọi path đều relative từ project root.
# Không hardcode giá trị này trực tiếp trong source code.

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:
  charset:        data/charset.txt
  font_list:      data/font_list.txt
  synthetic_train: data/synthetic/train
  synthetic_val:   data/synthetic/val
  synthetic_test:  data/synthetic/test
  real_data:       data/real
  error_samples:   data/errors
  reports:         reports

  # Model weights (điền sau khi có)
  det_model:      data/models/dbnet.onnx   # Mô hình Text Detection ONNX
  rec_model:      data/models/crnn.onnx    # Mô hình Text Recognition ONNX
  checkpoint_dir: checkpoints              # Thư mục lưu checkpoint khi train
  best_weight:    checkpoints/crnn.pth # File weights tốt nhất để chạy predict

# ─── Data Generation ──────────────────────────────────────────────────────────
data_gen:
  n_train:        20000    
  n_val:          2000    
  n_test:         2000
  val_ratio:      0.1        # 10% font dành riêng cho tập validation
  test_ratio:     0.1        # 10% font dành riêng cho tập test
  font_size_min:  10
  font_size_max:  52
  min_text_len:   2
  max_text_len:   40
  n_workers:      4          # số process song song khi gen
  corpus_prob:    0.95       # Xác suất lấy chữ từ Corpus thực tế
  word_split_prob: 0.7       # Xác suất cắt thành từ ngắn (1-2 từ)
  phrase_split_prob: 0.2     # Xác suất cắt thành cụm từ (3-5 từ)
  
  # Hard samples & UI Elements (Shadow/Stroke)
  hard_prob:      0.25       # Xác suất sinh ra cụm kí tự dễ nhầm (I, l, 1, 0, O...) để mô hình bắt buộc phải học
  shadow_prob:    0.25       # Xác suất đổ bóng cho chữ (giống text trên UI Windows)
  stroke_prob:    0.30       # Xác suất thêm viền ngoài (stroke) cho chữ
  
  # Background variation
  bg_light_prob:  0.60       # Xác suất sinh nền sáng
  bg_dark_prob:   0.20       # Xác suất sinh nền tối (phần còn lại sẽ sinh nền nhiễu mờ / texture)
  real_bg_prob:   0.30       # Xác suất crop nền từ ảnh screenshot thật
  
  # Diversity
  neg_prob:       0       # Xác suất sinh ảnh negative (không có text)
  multi_dpi_prob: 0.20       # Xác suất render text ở các scale lớn hơn rồi downscale
  
  # Font Selection
  common_fonts: ["arial", "segoe", "tahoma", "times", "verdana", "calibri", "cambria", "consolas", "roboto", "opensans"]
  common_font_weight: 10.0
  rare_font_weight: 1.0

# ─── Detector (DBNet) ─────────────────────────────────────────────────────────
detector:
  max_size:       960        # Kích thước ảnh tối đa (pixel) đưa vào DBNet. Giúp tránh tràn RAM, đảm bảo tốc độ.
  prob_threshold: 0.3        # Ngưỡng xác suất (Probability Map) quyết định pixel nào là viền chữ.
  unclip_ratio:   1.3        # Hệ số nới lỏng (padding) Bounding Box theo báo cáo phân tích
  min_area:       10         # Bỏ qua các Box có diện tích nhỏ hơn mức này để lọc nhiễu.
  min_padding_x:  2          # Padding an toàn tối thiểu (pixel) theo chiều X
  min_padding_y:  4          # Padding an toàn tối thiểu (pixel) theo chiều Y
  box_score_threshold: 0.3   # Confidence score tối thiểu của cả vùng bounding box
  normalize_mean: [0.485, 0.456, 0.406] # Tham số ImageNet Normalize (Mean)
  normalize_std:  [0.229, 0.224, 0.225] # Tham số ImageNet Normalize (Std)

# ─── Preprocessing ────────────────────────────────────────────────────────────
preprocess:
  target_h:       64         # Chiều cao ảnh CRNN, 64 giúp nhận diện tiếng Việt cực rõ nét
  normalize_mean: 0.5
  normalize_std:  0.5

# ─── Augmentation ─────────────────────────────────────────────────────────────
augmentation:
  blur_limit_min: 1
  blur_limit_max: 3
  blur_prob: 0.25             # Xác suất làm mờ ảnh (Gaussian Blur)
  compression_quality_min: 70
  compression_quality_max: 95
  compression_prob: 0.2       # Xác suất nén ảnh JPEG (giảm chất lượng/độ nét)
  brightness_limit: 0.15
  contrast_limit: 0.15
  brightness_contrast_prob: 0.3 # Xác suất thay đổi ngẫu nhiên độ sáng và độ tương phản
  noise_prob: 0.2             # Xác suất thêm nhiễu hạt (GaussNoise)
  sharpen_alpha_min: 0.1
  sharpen_alpha_max: 0.3
  sharpen_lightness_min: 0.8
  sharpen_lightness_max: 1.0
  sharpen_prob: 0.15          # Xác suất làm sắc nét ảnh (Sharpen)

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  batch_size:     16
  num_workers:    0
  max_label_len:  80
  epochs_phase1:  15         # Foundation: font lớn, bg trắng
  epochs_phase2:  20         # Robustness: augmentation mạnh
  epochs_phase3:  10         # Fine-tune: real screen capture
  lr:             0.001
  lr_finetune:    0.0001
  weight_decay:   0.0001
  grad_clip:      5.0
  amp:            true

# ─── CRNN Architecture ────────────────────────────────────────────────────────
model:
  backbone:       resnet18   # pretrained ImageNet
  lstm_hidden:    256
  lstm_layers:    2
  lstm_dropout:   0.1

# ─── Inference / Production ───────────────────────────────────────────────────
inference:
  conf_threshold: 0.6        # Confidence score tối thiểu để output
  min_box_area:   100        # Bỏ qua bbox quá nhỏ
  max_text_length: 200       # Giới hạn text dài tối đa
  timeout_sec:    0.5        # Timeout mỗi inference call
  providers:                 # ONNX Runtime execution providers (thứ tự ưu tiên)
    - CUDAExecutionProvider
    - CPUExecutionProvider

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:    INFO             # DEBUG / INFO / WARNING / ERROR
  format:   "%(asctime)s %(name)s %(levelname)s %(message)s"
